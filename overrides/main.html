{% extends "base.html" %}

{% block content %}
  {{ super() }}

  <div style="margin: 0 0 1rem 0">
    <button id="launch-thebe" class="md-button">
      Activer l'exécution (Thebe)
    </button>
  </div>

  <!-- Config Thebe : Binder + sélecteurs des cellules -->
  <script type="text/x-thebe-config">
  {
    "useBinder": true,
    "binderOptions": {
      "repo": "maximedieudonne/NeuroMorpho_ML_Pipeline",
      "ref": "main"
    },
    "kernelOptions": {
      "name": "python3",
      "path": "./docs/notebooks"
    },
    "requestKernel": true,
    /* Ces sélecteurs fonctionnent généralement avec mkdocs-jupyter/nbconvert.
       Si rien ne s'active, essaie:
       selector: "div.cell", selector_input: "pre", selector_output: ".output" */
    "selector": "div.cell",
    "selector_input": "div.input, pre",
    "selector_output": "div.output"

  }
  </script>

  <script>
  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('launch-thebe');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      try {
        btn.disabled = true;
        btn.textContent = 'Démarrage du kernel Binder... (1ère fois = ~1-3 min)';
        if (window.thebe) await thebe.bootstrap();
        btn.textContent = 'Prêt (utilise les boutons Run à côté des cellules)';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Échec — réessayer';
        console.error(e);
      }
    });
  });
  </script>
{% endblock %}
